<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AILA AI Trade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .card { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .glow { box-shadow: 0 0 20px rgba(0, 255, 136, 0.3); }
        .pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .bot-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: transparent;
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 8px;
            color: #00ff88;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }
        .bot-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }
        .bot-btn svg { width: 20px; height: 20px; }
        .mode-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .mode-btn-observer {
            background: rgba(100, 100, 100, 0.3);
            color: #9ca3af;
            border-color: rgba(100, 100, 100, 0.5);
        }
        .mode-btn-observer:hover {
            background: rgba(234, 179, 8, 0.2);
            color: #facc15;
            border-color: rgba(234, 179, 8, 0.5);
        }
        .mode-btn-observer.active {
            background: rgba(234, 179, 8, 0.3);
            color: #facc15;
            border-color: #facc15;
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.3);
        }
        .mode-btn-autopilot {
            background: rgba(100, 100, 100, 0.3);
            color: #9ca3af;
            border-color: rgba(100, 100, 100, 0.5);
        }
        .mode-btn-autopilot:hover {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border-color: rgba(0, 255, 136, 0.5);
        }
        .mode-btn-autopilot.active {
            background: rgba(0, 255, 136, 0.3);
            color: #00ff88;
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(0, 255, 136, 0.3);
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            text-align: center;
        }
        .modal-btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .modal-btn-confirm {
            background: rgba(0, 255, 136, 0.3);
            color: #00ff88;
            border: 1px solid #00ff88;
        }
        .modal-btn-confirm:hover {
            background: rgba(0, 255, 136, 0.5);
        }
        .modal-btn-cancel {
            background: rgba(100, 100, 100, 0.3);
            color: #9ca3af;
            border: 1px solid rgba(100, 100, 100, 0.5);
        }
        .modal-btn-cancel:hover {
            background: rgba(100, 100, 100, 0.5);
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <header class="mb-8 flex justify-between items-start">
            <div>
                <h1 class="text-4xl font-bold text-green-400">AILA AI Trade</h1>
                <p class="text-gray-400">Autonomous Intelligent Learning Algorithm</p>
            </div>
            <a href="/" class="bot-btn" title="AILA Bot">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="10" rx="2"/>
                    <circle cx="12" cy="5" r="2"/>
                    <path d="M12 7v4"/>
                    <line x1="8" y1="16" x2="8" y2="16"/>
                    <line x1="16" y1="16" x2="16" y2="16"/>
                </svg>
                Bot
            </a>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="card rounded-lg p-4 glow">
                <h3 class="text-gray-400 text-sm">AI Level</h3>
                <p class="text-3xl font-bold text-green-400" id="level">1</p>
                <div class="w-full bg-gray-700 rounded-full h-2 mt-2">
                    <div class="bg-green-400 h-2 rounded-full" id="xp-bar" style="width: 0%"></div>
                </div>
                <p class="text-xs text-gray-500 mt-1"><span id="xp">0</span> XP</p>
            </div>
            <div class="card rounded-lg p-4">
                <h3 class="text-gray-400 text-sm">Balance</h3>
                <p class="text-3xl font-bold" id="balance">$0.00</p>
                <p class="text-sm text-green-400" id="pnl">+0%</p>
            </div>
            <div class="card rounded-lg p-4">
                <h3 class="text-gray-400 text-sm">Win Rate</h3>
                <p class="text-3xl font-bold text-blue-400" id="winrate">0%</p>
            </div>
            <div class="card rounded-lg p-4">
                <h3 class="text-gray-400 text-sm">Mode</h3>
                <p class="text-3xl font-bold text-yellow-400 mb-3" id="mode">OBSERVER</p>
                <div class="flex gap-2">
                    <button id="btn-observer" class="mode-btn mode-btn-observer active" onclick="switchMode('OBSERVER')">
                        <i class="fa-solid fa-eye"></i> OBSERVER
                    </button>
                    <button id="btn-autopilot" class="mode-btn mode-btn-autopilot" onclick="confirmAutopilot()">
                        <i class="fa-solid fa-robot"></i> AUTOPILOT
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 mb-8">
            <div class="card rounded-lg p-4 lg:col-span-2">
                <h2 class="text-xl font-bold mb-4">Agents</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-2" id="agents-grid"></div>
            </div>
            <div class="card rounded-lg p-4">
                <h2 class="text-xl font-bold mb-4">Skills</h2>
                <div id="skills-list"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-8">
            <div class="card rounded-lg p-4">
                <h2 class="text-xl font-bold mb-4">Opportunities</h2>
                <div id="opportunities" class="space-y-2"></div>
            </div>
            <div class="card rounded-lg p-4">
                <h2 class="text-xl font-bold mb-4">Whale Signal</h2>
                <div id="whale-signal"></div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-8">
            <div class="card rounded-lg p-4">
                <h2 class="text-xl font-bold mb-4">Sentiment</h2>
                <div id="sentiment"></div>
            </div>
            <div class="card rounded-lg p-4">
                <h2 class="text-xl font-bold mb-4">Prediction BTC</h2>
                <div id="prediction"></div>
            </div>
        </div>

        <div class="card rounded-lg p-4">
            <h2 class="text-xl font-bold mb-4">Agent Logs</h2>
            <div id="logs" class="font-mono text-sm text-gray-400 max-h-64 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Autopilot Confirmation Modal -->
    <div id="autopilot-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="text-4xl mb-4"><i class="fa-solid fa-robot text-green-400"></i></div>
            <h3 class="text-xl font-bold mb-2">Включить AUTOPILOT?</h3>
            <p class="text-gray-400 mb-6">Вы уверены? AI начнёт торговать реальными деньгами.</p>
            <div class="flex gap-3 justify-center">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Отмена</button>
                <button class="modal-btn modal-btn-confirm" onclick="startAutopilot()">
                    <i class="fa-solid fa-play"></i> Да, включить
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/ai-trade';

        async function fetchData(endpoint) {
            try {
                const response = await fetch(API_BASE + endpoint);
                if (!response.ok) return null;
                return await response.json();
            } catch (e) {
                console.error('Fetch error:', e);
                return null;
            }
        }

        function updateModeButtons(mode) {
            const btnObserver = document.getElementById('btn-observer');
            const btnAutopilot = document.getElementById('btn-autopilot');
            const modeDisplay = document.getElementById('mode');

            if (mode === 'AUTOPILOT') {
                btnObserver.classList.remove('active');
                btnAutopilot.classList.add('active');
                modeDisplay.textContent = 'AUTOPILOT';
                modeDisplay.classList.remove('text-yellow-400');
                modeDisplay.classList.add('text-green-400');
            } else {
                btnAutopilot.classList.remove('active');
                btnObserver.classList.add('active');
                modeDisplay.textContent = 'OBSERVER';
                modeDisplay.classList.remove('text-green-400');
                modeDisplay.classList.add('text-yellow-400');
            }
        }

        async function switchMode(mode) {
            if (mode === 'OBSERVER') {
                try {
                    const response = await fetch(API_BASE + '/mode', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: 'OBSERVER' })
                    });
                    if (response.ok) {
                        updateModeButtons('OBSERVER');
                    }
                } catch (e) {
                    console.error('Switch mode error:', e);
                }
            }
        }

        function confirmAutopilot() {
            document.getElementById('autopilot-modal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('autopilot-modal').classList.remove('show');
        }

        async function startAutopilot() {
            closeModal();
            try {
                const response = await fetch(API_BASE + '/autopilot/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                if (response.ok) {
                    updateModeButtons('AUTOPILOT');
                }
            } catch (e) {
                console.error('Start autopilot error:', e);
            }
        }

        // Close modal on overlay click
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('autopilot-modal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
        });

        async function updateDashboard() {
            const status = await fetchData('/status');
            if (status) {
                const currentMode = status.mode || 'OBSERVER';
                updateModeButtons(currentMode);
                if (status.knowledge) {
                    document.getElementById('winrate').textContent =
                        (status.knowledge.win_rate * 100).toFixed(1) + '%';
                }
                if (status.trader_profile) {
                    document.getElementById('level').textContent = status.trader_profile.level || 1;
                    document.getElementById('xp').textContent = status.trader_profile.xp || 0;
                    const xpPct = ((status.trader_profile.xp || 0) / (status.trader_profile.next_level_xp || 100)) * 100;
                    document.getElementById('xp-bar').style.width = Math.min(xpPct, 100) + '%';
                }
            }

            // Fetch balance from portfolio
            const portfolio = await fetchData('/portfolio');
            if (portfolio && portfolio.capital) {
                const total = portfolio.capital.total || 0;
                document.getElementById('balance').textContent = '$' + total.toFixed(2);
            }

            const profile = await fetchData('/profile');
            if (profile && profile.skills) {
                const skillsHtml = Object.entries(profile.skills).map(([name, data]) => {
                    const level = typeof data === 'object' ? (data.level || 1) : data;
                    return `<div class="flex justify-between mb-2">
                        <span class="text-gray-400">${name}</span>
                        <span class="text-green-400">Lv.${level}</span>
                    </div>`;
                }).join('');
                document.getElementById('skills-list').innerHTML = skillsHtml || '<p class="text-gray-500">No skills yet</p>';
            }

            const agents = await fetchData('/agents');
            if (agents && agents.agents) {
                const agentsHtml = agents.agents.map(a =>
                    `<div class="bg-gray-800 rounded p-2 text-center">
                        <div class="text-green-400 text-xs pulse">&#9679;</div>
                        <div class="text-xs font-bold">${a.name}</div>
                    </div>`
                ).join('');
                document.getElementById('agents-grid').innerHTML = agentsHtml;
            }

            const sentiment = await fetchData('/sentiment');
            if (sentiment && sentiment.market_sentiment) {
                const s = sentiment.market_sentiment;
                const sentimentText = s.sentiment || s.label || 'unknown';
                const isNegative = sentimentText.includes('fear') || sentimentText.includes('bearish');
                document.getElementById('sentiment').innerHTML =
                    `<div class="text-2xl font-bold ${isNegative ? 'text-red-400' : 'text-green-400'}">${sentimentText}</div>
                    <div class="text-gray-400">Score: ${s.score || 0}/100</div>`;
            } else {
                document.getElementById('sentiment').innerHTML = '<p class="text-gray-500">Loading...</p>';
            }

            const prediction = await fetchData('/prediction/BTCUSDT');
            if (prediction && prediction.prediction) {
                const p = prediction.prediction;
                const dir = p.direction || 'unknown';
                document.getElementById('prediction').innerHTML =
                    `<div class="text-2xl font-bold ${dir === 'up' ? 'text-green-400' : 'text-red-400'}">${dir.toUpperCase()}</div>
                    <div class="text-gray-400">Probability: ${p.probability || 0}%</div>
                    <div class="text-gray-400">Confidence: ${p.confidence || 0}%</div>`;
            } else {
                document.getElementById('prediction').innerHTML = '<p class="text-gray-500">Loading...</p>';
            }

            const whale = await fetchData('/whale/BTCUSDT');
            if (whale) {
                document.getElementById('whale-signal').innerHTML =
                    `<div class="text-2xl font-bold">${whale.signal || 'neutral'}</div>
                    <div class="text-gray-400">Confidence: ${whale.confidence || 0}%</div>
                    <div class="text-gray-400 text-sm mt-2">${whale.reasoning || ''}</div>`;
            } else {
                document.getElementById('whale-signal').innerHTML = '<p class="text-gray-500">Loading...</p>';
            }

            const logs = await fetchData('/logs?limit=20');
            if (logs && logs.logs && logs.logs.length > 0) {
                const logsHtml = logs.logs.map(l =>
                    `<div class="border-b border-gray-700 py-1">${typeof l === 'string' ? l : `[${l.agent}] ${l.log}`}</div>`
                ).join('');
                document.getElementById('logs').innerHTML = logsHtml;
            } else {
                document.getElementById('logs').innerHTML = '<p class="text-gray-500">No logs yet</p>';
            }
        }

        updateDashboard();
        setInterval(updateDashboard, 30000);
    </script>
</body>
</html>
