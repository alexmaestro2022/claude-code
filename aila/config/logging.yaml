# AILA - Logging Configuration

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  detailed:
    format: "%(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  json:
    class: structlog.stdlib.ProcessorFormatter
    processor: structlog.processors.JSONRenderer()

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: detailed
    filename: logs/aila.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: logs/error.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf8

  trades_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/trades.log
    maxBytes: 52428800  # 50MB
    backupCount: 10
    encoding: utf8

loggers:
  aila:
    level: DEBUG
    handlers:
      - console
      - file
    propagate: false

  aila.trading:
    level: INFO
    handlers:
      - console
      - file
      - trades_file
    propagate: false

  aila.exchange:
    level: INFO
    handlers:
      - console
      - file
    propagate: false

  aila.strategy:
    level: INFO
    handlers:
      - console
      - file
    propagate: false

  # Third-party libraries
  pybit:
    level: WARNING
    handlers:
      - console
    propagate: false

  ccxt:
    level: WARNING
    handlers:
      - console
    propagate: false

  uvicorn:
    level: INFO
    handlers:
      - console
    propagate: false

  sqlalchemy:
    level: WARNING
    handlers:
      - console
    propagate: false

root:
  level: INFO
  handlers:
    - console
    - file
    - error_file
